# Clips (design §11.1): Wan 2.2 I2V 14B fp8 with lightx2v's 4-step LoRA on both experts (the trial's
# "fast" setup): hone-models' packaged entry with the library's copy of its workflow, so a change in the
# catalog cannot move the node ids. The stage sends `duration_s` = (frames - 1) / 16, which the entry
# turns back into exactly `frames` (ceil(ms * 16 / 1000) + 1, 33 to 129: 8 s is the tested maximum), and
# `size` 832x480, or 960x544 for faces up to 110 frames (longer ones and 1280x720 do not fit 8 GB, D-082).
# A ComfyUI the library starts for its session runs with --use-sage-attention (22% faster; the adapter,
# D-033): ComfyUI's Python needs the `sageattention` package. A ComfyUI already running is used as it is.
[models."wan2.2-i2v-14b"]
workflow = "workflows/wan2.2-i2v-14b.json"
defaults = { size = "832x480", duration_s = 5 }
max_timeout_s = 7200.0
[models."wan2.2-i2v-14b".capabilities]
license = "Apache-2.0"
commercial_use = true
max_duration_s = 8
vram_gb = 7.6  # measured peak 7.7 GB for the whole GPU (design §15): it needs the whole card

# The finish (design §11.3, D-032): Real-ESRGAN x2plus (BSD-3) frame by frame, Lanczos to the output size
# (`size`, 1920x1080 for 16:9 at 1080), then RIFE 4.9 x2 (16 -> 32 fps), in one ComfyUI job per clip.
# Needs ComfyUI-Frame-Interpolation and models/upscale_models/RealESRGAN_x2plus.pth.
[models."esrgan-rife-x2"]
provider = "comfyui"
kind = "video"
workflow = "workflows/esrgan-rife-x2.json"
outputs = ["5"]
defaults = { size = "1920x1080" }
max_timeout_s = 3600.0
[models."esrgan-rife-x2".capabilities]
vram_gb = 2.0  # measured 1.6 GB peak for the whole GPU (design §15)
license = "BSD-3-Clause (Real-ESRGAN), MIT (RIFE)"
commercial_use = true
[models."esrgan-rife-x2".inputs]
video = "1.file"
width = "8.width"
height = "8.height"
